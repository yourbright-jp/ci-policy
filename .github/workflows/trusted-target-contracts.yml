name: trusted-target-contracts

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  trusted-contracts:
    name: trusted-contracts
    if: github.repository != 'yourbright-jp/ci-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          path: target
          persist-credentials: false

      - name: Checkout pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: target-base
          persist-credentials: false

      - name: Checkout merge group base
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: target-base
          persist-credentials: false

      - name: Checkout policy implementation
        uses: actions/checkout@v6
        with:
          repository: yourbright-jp/ci-policy
          ref: v9
          path: ci-policy
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Prepare trusted Bun sandbox
        run: |
          docker pull oven/bun:1.4.3@sha256:ec06c3b6cea04192ae6770c434f668ca41d343ad19fa6472216c7b48be39c598
          bun ci-policy/scripts/assert-bun-sandbox.ts

      - name: Run central policy checks
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: >-
          bun ci-policy/dist/check-workflows.mjs
          --repo "$GITHUB_WORKSPACE/target"
          --base-repo "$GITHUB_WORKSPACE/target-base"
          --require-trusted-contract
          --repository "$TARGET_REPOSITORY"
