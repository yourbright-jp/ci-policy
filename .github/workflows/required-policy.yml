name: required-policy

on:
  workflow_call:
    inputs:
      repository:
        description: Repository name in owner/name form.
        required: false
        type: string
      policy-ref:
        description: ci-policy self-test ref. Ignored for caller repositories.
        required: false
        default: v5
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          path: target

      - name: Checkout policy repository
        uses: actions/checkout@v6
        with:
          repository: yourbright-jp/ci-policy
          ref: ${{ github.repository == 'yourbright-jp/ci-policy' && inputs.policy-ref || 'v5' }}
          path: ci-policy

      - name: Setup Bun for policy self-test
        if: github.repository == 'yourbright-jp/ci-policy'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      - name: Verify policy distribution
        if: github.repository == 'yourbright-jp/ci-policy'
        working-directory: ci-policy
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test
          git diff --exit-code -- dist

      - name: Validate pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ci-policy/dist/check-pr-body.mjs

      - name: Run policy checks
        env:
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: >-
          node ci-policy/dist/check-workflows.mjs
          --repo "$GITHUB_WORKSPACE/target"
          --repository "$TARGET_REPOSITORY"
