name: required-policy

on:
  workflow_call:
    inputs:
      repository:
        description: Repository name in owner/name form.
        required: false
        type: string
      policy-ref:
        description: ci-policy self-test ref. Ignored for caller repositories.
        required: false
        default: v9
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # PR/push は required-check 用の成功だけ返す。本体は nightly / dispatch。
      # ci-policy 自身の PR では従来どおりフル実行する。
      FULL_POLICY: ${{ github.repository == 'yourbright-jp/ci-policy' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Defer PR/push policy to nightly
        if: env.FULL_POLICY != 'true'
        run: |
          echo "Full policy deferred to nightly (03:00 JST) or workflow_dispatch."
          echo "event=${{ github.event_name }} repo=${{ github.repository }}"

      - name: Checkout target repository
        if: env.FULL_POLICY == 'true'
        uses: actions/checkout@v6
        with:
          path: target
          persist-credentials: false

      - name: Checkout pull request base
        if: env.FULL_POLICY == 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: target-base
          persist-credentials: false

      - name: Checkout merge group base
        if: env.FULL_POLICY == 'true' && github.event_name == 'merge_group'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: target-base
          persist-credentials: false

      - name: Checkout push parent
        if: env.FULL_POLICY == 'true' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.before }}
          path: target-base
          persist-credentials: false

      - name: Checkout policy repository
        if: env.FULL_POLICY == 'true'
        uses: actions/checkout@v6
        with:
          repository: yourbright-jp/ci-policy
          ref: ${{ github.repository == 'yourbright-jp/ci-policy' && inputs.policy-ref || 'v9' }}
          path: ci-policy
          persist-credentials: false

      - name: Setup Bun
        if: env.FULL_POLICY == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Prepare trusted Bun sandbox
        if: env.FULL_POLICY == 'true'
        run: |
          docker pull oven/bun:1.4.3@sha256:ec06c3b6cea04192ae6770c434f668ca41d343ad19fa6472216c7b48be39c598
          bun ci-policy/scripts/assert-bun-sandbox.ts

      - name: Verify policy distribution
        if: env.FULL_POLICY == 'true' && github.repository == 'yourbright-jp/ci-policy'
        working-directory: ci-policy
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test
          git diff --exit-code -- dist

      - name: Validate pull request body
        if: env.FULL_POLICY == 'true' && github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun ci-policy/dist/check-pr-body.mjs

      - name: Run policy checks
        if: env.FULL_POLICY == 'true'
        env:
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          extra=()
          if [ -d "$GITHUB_WORKSPACE/target-base" ]; then
            extra+=(--base-repo "$GITHUB_WORKSPACE/target-base")
          fi
          bun ci-policy/dist/check-workflows.mjs \
            --repo "$GITHUB_WORKSPACE/target" \
            "${extra[@]}" \
            --repository "$TARGET_REPOSITORY"
